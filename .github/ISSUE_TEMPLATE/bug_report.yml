name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Import statement PDFs from ...
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened.
    validations:
      required: true

  - type: dropdown
    id: bank
    attributes:
      label: Bank
      description: Which bank's statements are involved?
      options:
        # AUTO-GENERATED: bank options start
        - Halifax Bank UK
        - HSBC Bank UK
        - NatWest Bank UK
        - TSB Bank UK
        - Other / N/A
        # AUTO-GENERATED: bank options end
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: "Output of `uv run openstan --version` (or found in the app's About dialog)."
      placeholder: "e.g. 0.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context about the problem (e.g. log output, error messages).
