name: Docs

on:
  push:
    branches: [master]
    paths:
      # Rebuild when doc sources or manually committed screenshots change
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:  # allow manual trigger

# Only one deploy at a time; cancel in-flight runs on new push
concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}  # no workflow-level permissions; job declares its own

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # GitHub limitation: no branch-specific permissions available
                       # Job only pushes to gh-pages via ghp-import

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Generate bank data
        run: uv run python docs/scripts/generate_bank_data.py

      - name: Build docs
        run: uv run zensical build
        env:
          GOATCOUNTER_URL: ${{ secrets.GOATCOUNTER_URL }}
          STATCOUNTER_PROJECT_ID: ${{ secrets.STATCOUNTER_PROJECT_ID }}

      - name: Deploy to GitHub Pages
        run: |
          uv run ghp-import \
            --no-jekyll \
            --push \
            --force \
            --branch gh-pages \
            --cname openstan.org \
            site
